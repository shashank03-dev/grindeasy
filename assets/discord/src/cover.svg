<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 576">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="576" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#14171F"/>
      <stop offset="1" stop-color="#0A0C10"/>
    </linearGradient>
    <radialGradient id="peakGlow" cx="970" cy="220" r="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF8A2B" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FF8A2B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="diamondBar" x1="936" y1="220" x2="1004" y2="470" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFC24D"/>
      <stop offset="0.55" stop-color="#FF8A2B"/>
      <stop offset="1" stop-color="#FF3D57"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#EDEFF2" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="1024" height="576" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="576" fill="url(#grid)"/>
  <rect x="0" y="0" width="1024" height="576" fill="url(#peakGlow)"/>

  <!-- terminal transcript, left column -->
  <text x="64" y="146" font-family="JetBrainsMono Nerd Font Mono" font-weight="500" font-size="24" letter-spacing="0.5" xml:space="preserve">
    <tspan fill="#FF9A3D">$</tspan><tspan fill="#8A93A6" dx="10">npx grindeasy</tspan>
  </text>

  <text x="64" y="270" font-family="JetBrainsMono Nerd Font Mono" font-weight="800" font-size="108" fill="#EDEFF2" letter-spacing="-2">grindeasy</text>
  <rect x="662" y="192" width="18" height="82" fill="#FF9A3D"/>

  <text x="64" y="330" font-family="JetBrainsMono Nerd Font Mono" font-weight="600" font-size="30" fill="#FF9A3D" letter-spacing="1">rank up while you ship</text>
  <text x="64" y="372" font-family="JetBrainsMono Nerd Font Mono" font-weight="500" font-size="20" fill="#6B7280" letter-spacing="0.3">live-synced to your Discord rank</text>

  <!-- tier staircase, signature element: the product's real tier ladder, ascending -->
  <line x1="580" y1="470.5" x2="1010" y2="470.5" stroke="#232733" stroke-width="2"/>

  <rect x="592" y="414" width="68" height="56" fill="#454B58"/>
  <text x="626" y="398" font-family="JetBrainsMono Nerd Font Mono" font-size="26" fill="#767E90" text-anchor="middle">&#9650;</text>

  <rect x="678" y="370" width="68" height="100" fill="#58606F"/>
  <text x="712" y="354" font-family="JetBrainsMono Nerd Font Mono" font-size="30" fill="#97A0B3" text-anchor="middle">&#9632;</text>

  <rect x="764" y="322" width="68" height="148" fill="#A97A34"/>
  <text x="798" y="306" font-family="JetBrainsMono Nerd Font Mono" font-size="34" fill="#E3A94A" text-anchor="middle">&#9733;</text>

  <rect x="850" y="274" width="68" height="196" fill="#FF8A2B"/>
  <text x="884" y="258" font-family="JetBrainsMono Nerd Font Mono" font-size="38" fill="#FFC24D" text-anchor="middle">&#9670;</text>

  <rect x="936" y="220" width="68" height="250" fill="url(#diamondBar)"/>
  <text x="970" y="204" font-family="JetBrainsMono Nerd Font Mono" font-size="44" fill="#FFFFFF" text-anchor="middle">&#10070;</text>
  <text x="970" y="496" font-family="JetBrainsMono Nerd Font Mono" font-weight="600" font-size="15" fill="#8A93A6" letter-spacing="2" text-anchor="middle">DIAMOND</text>
</svg>
