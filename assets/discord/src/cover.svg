<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 576">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="576" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f1512"/>
      <stop offset="1" stop-color="#0a0d0c"/>
    </linearGradient>
    <radialGradient id="peakGlow" cx="970" cy="220" r="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#82d399" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#82d399" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="diamondBar" x1="936" y1="220" x2="1004" y2="470" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a3efee"/>
      <stop offset="0.55" stop-color="#7ae6e5"/>
      <stop offset="1" stop-color="#57c9bd"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#82d399" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="1024" height="576" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="576" fill="url(#grid)"/>
  <rect x="0" y="0" width="1024" height="576" fill="url(#peakGlow)"/>

  <!-- top-left lockup: ascent mark + command -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="64,150 82,130 100,150" stroke="#4b8057" stroke-width="7"/>
    <polyline points="64,138 82,118 100,138" stroke="#82d399" stroke-width="7"/>
  </g>
  <text x="120" y="146" font-family="JetBrainsMono Nerd Font Mono" font-weight="500" font-size="24" letter-spacing="0.5" xml:space="preserve">
    <tspan fill="#82d399">$</tspan><tspan fill="#838b87" dx="10">npx grindeasy</tspan>
  </text>

  <text x="64" y="270" font-family="JetBrainsMono Nerd Font Mono" font-weight="800" font-size="108" fill="#e3e7e4" letter-spacing="-2">grindeasy</text>
  <rect x="662" y="192" width="18" height="82" fill="#82d399"/>

  <text x="64" y="330" font-family="JetBrainsMono Nerd Font Mono" font-weight="600" font-size="30" fill="#82d399" letter-spacing="1">rank up while you ship</text>
  <text x="64" y="372" font-family="JetBrainsMono Nerd Font Mono" font-weight="500" font-size="20" fill="#838b87" letter-spacing="0.3">live-synced to your Discord rank</text>

  <!-- tier staircase, signature element: the real bronze-to-diamond ladder, ascending -->
  <line x1="580" y1="470.5" x2="1010" y2="470.5" stroke="#242c27" stroke-width="2"/>

  <rect x="592" y="414" width="68" height="56" fill="#7d5540"/>
  <text x="626" y="398" font-family="JetBrainsMono Nerd Font Mono" font-size="26" fill="#c48961" text-anchor="middle">&#9650;</text>

  <rect x="678" y="370" width="68" height="100" fill="#71767e"/>
  <text x="712" y="354" font-family="JetBrainsMono Nerd Font Mono" font-size="30" fill="#babec4" text-anchor="middle">&#9632;</text>

  <rect x="764" y="322" width="68" height="148" fill="#9a7f2e"/>
  <text x="798" y="306" font-family="JetBrainsMono Nerd Font Mono" font-size="34" fill="#e7bf4a" text-anchor="middle">&#9733;</text>

  <rect x="850" y="274" width="68" height="196" fill="#7e9394"/>
  <text x="884" y="258" font-family="JetBrainsMono Nerd Font Mono" font-size="38" fill="#c2dedf" text-anchor="middle">&#9670;</text>

  <rect x="936" y="220" width="68" height="250" fill="url(#diamondBar)"/>
  <text x="970" y="204" font-family="JetBrainsMono Nerd Font Mono" font-size="44" fill="#c9f7f6" text-anchor="middle">&#10070;</text>
  <text x="970" y="496" font-family="JetBrainsMono Nerd Font Mono" font-weight="600" font-size="15" fill="#838b87" letter-spacing="2" text-anchor="middle">DIAMOND</text>
</svg>
